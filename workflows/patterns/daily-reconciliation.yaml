# KCOS Pattern: Daily Reconciliation
# Universal pattern for end-of-day business summary
#
# Industries: All
# Trigger: Scheduled (6 PM EAT daily)

id: pattern.daily-reconciliation.v1
name: Daily Business Reconciliation
description: |
  Aggregates daily business metrics (orders, revenue, outstanding),
  formats a summary, and sends to business owner via WhatsApp.
version: "1.0"
tags:
  - pattern
  - reconciliation
  - reporting
  - scheduled
  - universal

trigger:
  type: schedule.cron
  schedule: "0 18 * * *"  # 6 PM daily (EAT)

steps:
  # Step 1: Log reconciliation start
  - id: log_start
    action: debug.log
    input:
      message: "Starting daily reconciliation for {{ trigger.businessId }}"
      level: info

  # Step 2: Aggregate today's metrics
  # Note: This would use a report.aggregate action when implemented
  # For now, we use data.transform with placeholder logic
  - id: aggregate_metrics
    action: data.transform
    input:
      mapping:
        businessId: "{{ trigger.businessId }}"
        date: "{{ $now() }}"
        # These would come from database aggregation
        totalOrders: "{{ trigger.metrics.totalOrders }}"
        totalRevenue: "{{ trigger.metrics.totalRevenue }}"
        outstandingAmount: "{{ trigger.metrics.outstandingAmount }}"
        topProducts: "{{ trigger.metrics.topProducts }}"
    output: report

  # Step 3: Format summary message
  - id: format_summary
    action: data.transform
    input:
      mapping:
        message: |
          📊 *Muhtasari wa Leo*
          
          📦 Oda: {{ report.totalOrders }}
          💰 Mapato: KSh {{ report.totalRevenue }}
          ⚠️ Madeni: KSh {{ report.outstandingAmount }}
          
          📈 Bidhaa Bora:
          {{ report.topProducts }}
          
          Asante kwa biashara yako! 🙏
    output: formatted

  # Step 4: Send to business owner
  - id: send_summary
    action: whatsapp.send
    input:
      to: "{{ trigger.ownerPhone }}"
      message: "{{ formatted.message }}"

  # Step 5: Log completion
  - id: log_complete
    action: event.log
    input:
      eventType: reconciliation.daily.completed
      eventData:
        businessId: "{{ trigger.businessId }}"
        date: "{{ report.date }}"
        totalOrders: "{{ report.totalOrders }}"
        totalRevenue: "{{ report.totalRevenue }}"
